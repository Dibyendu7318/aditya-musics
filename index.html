<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musicfy</title>
<meta name="theme-color" content="#1A1410">

<!-- ---- PWA / "Add to Home Screen" support ---- -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Musicfy">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family: 'AMS Deepak';
    src: url('AMS_Deepak.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  @font-face{
    font-family: 'Old London';
    src: url('OldLondon.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --cream: #F5EFE4;
    --muted: rgba(245,239,228,0.68);
    --faint: rgba(245,239,228,0.42);
    --glass-border: rgba(255,255,255,0.28);
    --accent: #E8C468;
    --green: #3DDC84;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  .bg-photo{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center;
    z-index: -1;
    pointer-events: none;
  }

  .butterfly-overlay{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.7s ease;
  }

  .boy-cutout{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center;
    z-index: 1;
    pointer-events: none;
  }
  .butterfly-overlay.show{
    opacity: 1;
  }

  body{
    background: #1A1410;
    color: var(--cream);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .center-name{
    font-family: 'AMS Deepak', 'Yatra One', cursive;
    font-size: clamp(15px, 4vw, 24px);
    color: #FF7A1A;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.4);
    pointer-events: none;
    text-align: center;
    line-height: 1;
  }

  .caption-strip{
    width: min(240px, 78vw);
    text-align: center;
    color: #FF1A1A;
    font-family: 'Old London', Georgia, 'Times New Roman', serif;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0.4px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    white-space: pre-line;
  }
  .caption-strip.show{
    opacity: 1;
    transform: translateY(0);
  }

  .top-left-time{
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    font-size: 11.5px;
    color: var(--faint);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    z-index: 2;
  }

  .live-badge{
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    white-space: nowrap;
    z-index: 2;
  }
  .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px 1px rgba(61,220,132,0.7);
    flex-shrink: 0;
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  @keyframes pulse-dot{
    0%, 100%{ opacity:1; transform: scale(1); }
    50%{ opacity:0.55; transform: scale(0.85); }
  }

  .menu-wrap{
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    z-index: 5;
  }
  .menu-btn{
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background 0.15s;
  }
  .menu-btn:hover{ background: rgba(255,255,255,0.18); }
  .menu-btn svg{ width: 16px; height: 16px; }

  .menu-dropdown{
    position: absolute;
    top: 40px;
    right: 0;
    width: min(230px, 82vw);
    max-width: min(230px, 82vw);
    box-sizing: border-box;
    background: rgba(25,18,10,0.88);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 6px;
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    box-shadow: 0 16px 40px -14px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: min(60vh, 340px);
    overflow-y: auto;
    overflow-x: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.96);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease, visibility 0s linear 0.22s;
  }
  .menu-dropdown.open{
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    pointer-events: auto;
    transition: opacity 0.22s ease, transform 0.22s ease, visibility 0s linear 0s;
  }

  .menu-dropdown > *{
    animation: menuItemIn 0.22s ease both;
  }
  .menu-dropdown.menu-fade-out > *{
    animation: none;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 0.13s ease, transform 0.13s ease;
  }
  @keyframes menuItemIn{
    from{ opacity: 0; transform: translateX(8px); }
    to{ opacity: 1; transform: translateX(0); }
  }
  .menu-item{
    display:block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'Poppins', sans-serif;
    font-size: 12.5px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .menu-item:hover{ background: rgba(255,255,255,0.08); color: var(--cream); }
  .menu-item.active{
    color: #FFD700;
    font-weight: 600;
    background: rgba(255,215,0,0.1);
  }
  .menu-back{
    color: var(--accent);
    font-weight: 600;
  }
  .menu-header{
    padding: 8px 10px 4px;
    font-size: 10.5px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .menu-loading, .menu-empty{
    padding: 16px 10px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .song-item{
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    text-align: left;
    background: transparent;
    border: none;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .song-item:hover{ background: rgba(255,255,255,0.08); }
  .song-item.active{ background: rgba(255,215,0,0.12); }
  .song-item .song-title{
    font-size: 12px;
    font-weight: 600;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-item.active .song-title{ color: #FFD700; }
  .song-item .song-artist{
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .menu-search-wrap{
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .menu-search-input{
    width: 100%;
    box-sizing: border-box;
    background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.12));
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 8px 11px;
    color: var(--cream);
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), inset 0 -1px 1px rgba(0,0,0,0.15);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .menu-search-input::placeholder{ color: var(--faint); }
  .menu-search-input:focus{ border-color: rgba(255,255,255,0.45); }
  .menu-search-input.as-button{
    text-align: left;
    cursor: pointer;
  }
  .menu-search-input.as-button:hover{ border-color: rgba(255,255,255,0.45); }

  .menu-list-items{
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    box-sizing: border-box;
  }

  .bottom-stack{
    position: fixed;
    bottom: max(6px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    z-index: 3;
  }

  .player-card{
    position: relative;
    width: min(228px, 76vw);
    overflow: hidden;
    background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04) 60%, rgba(255,255,255,0.1));
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 9px 11px 9px;
    backdrop-filter: blur(26px) saturate(160%);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    box-shadow:
      0 12px 40px -12px rgba(0,0,0,0.55),
      inset 0 1px 1px rgba(255,255,255,0.45),
      inset 0 -1px 1px rgba(0,0,0,0.18);
  }
  .player-card::before{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:220%; height:100%;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.14) 50%, transparent 58%);
    pointer-events:none;
  }
  .player-card::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius: 18px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    pointer-events:none;
  }

  .player-row{
    display:flex;
    align-items:center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .art{
    width: 37px;
    height: 37px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid var(--glass-border);
    flex-shrink: 0;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12px;
    animation: spin 7s linear infinite;
    animation-play-state: paused;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    position: relative;
  }
  .art::after{
    content:'';
    position:absolute;
    top:50%;
    left:50%;
    width: 6px;
    height: 6px;
    background: rgba(0,0,0,0.7);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
    z-index: 2;
    pointer-events: none;
  }
  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }
  .art img{
    width:100%;
    height:100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center;
    display:none;
  }

  .meta{
    flex: 1;
    min-width: 0;
  }
  .meta .track-title{
    font-weight: 600;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0 0 2px;
  }
  .meta .track-sub{
    font-size: 9px;
    color: var(--muted);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .controls{
    display:flex;
    align-items:center;
    gap: 5px;
    flex-shrink: 0;
  }
  .ctrl-btn{
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .ctrl-btn:hover{ background: rgba(255,255,255,0.18); }
  .ctrl-btn:active{ transform: scale(0.93); }
  .ctrl-btn.play{
    width: 28px;
    height: 28px;
    background: var(--cream);
    color: #241A0E;
  }
  .ctrl-btn.play:hover{ background: #fff; }
  .ctrl-btn svg{ width: 9px; height: 9px; }
  .ctrl-btn.play svg{ width: 11px; height: 11px; }

  .progress-row{
    display:flex;
    align-items:center;
    gap: 7px;
    margin-top: 7px;
    font-size: 7.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    position: relative;
    z-index: 1;
  }
  .progress-track{
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
    position: relative;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: var(--cream);
    border-radius: 2px;
    transition: width 0.3s linear;
  }

  .player-frame{
    width: 1px;
    height: 1px;
    overflow: hidden;
    position: absolute;
    left: -9999px;
  }

  .hint-marquee{
    width: min(228px, 76vw);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .hint-marquee-track{
    display: inline-flex;
    width: max-content;
    gap: 46px;
    animation: hint-marquee-scroll 10s linear infinite;
  }
  .hint-marquee-text{
    display: inline-block;
    white-space: nowrap;
    color: #FFD54A;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-shadow: 0 0 10px rgba(255,213,74,0.45), 0 2px 5px rgba(0,0,0,0.6);
  }
  @keyframes hint-marquee-scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(calc(-50% - 23px)); }
  }

  .credit-block{
    text-align: center;
  }
  .made-with{
    font-size: 9px;
    color: var(--muted);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    margin: 0 0 4px;
  }
  .insta-link{
    display:inline-flex;
    align-items:center;
    gap: 4px;
    text-decoration: none;
    color: var(--cream);
    font-size: 10px;
    font-weight: 500;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    padding: 4px 10px;
    border-radius: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.15s;
  }
  .insta-link:hover{ background: rgba(255,255,255,0.18); }
  .insta-link svg{ width: 11px; height: 11px; flex-shrink: 0; }

  @media (max-width: 420px){
    .center-name{ font-size: 7vw; }
    .top-left-time{ font-size: 10px; }
    .live-badge{ font-size: 10px; }
    .caption-strip{ font-size: 11px; }
  }

  @media (orientation: landscape) and (max-height: 500px){
    .bottom-stack{ gap: 6px; bottom: max(8px, env(safe-area-inset-bottom)); }
    .center-name{ font-size: clamp(13px, 3vw, 19px); }
    .caption-strip{ font-size: 10.5px; line-height: 1.25; width: min(230px, 60vw); }
    .player-card{ width: min(220px, 55vw); padding: 8px 10px 8px; border-radius: 16px; }
    .player-row{ gap: 8px; }
    .art{ width: 32px; height: 32px; font-size: 12px; }
    .art::after{ width: 4px; height: 4px; }
    .meta .track-title{ font-size: 10.5px; }
    .meta .track-sub{ font-size: 9px; }
    .controls{ gap: 4px; }
    .ctrl-btn{ width: 23px; height: 23px; }
    .ctrl-btn.play{ width: 27px; height: 27px; }
    .ctrl-btn svg{ width: 9px; height: 9px; }
    .ctrl-btn.play svg{ width: 10px; height: 10px; }
    .progress-row{ margin-top: 6px; font-size: 8px; gap: 6px; }
    .credit-block .made-with{ font-size: 9px; margin-bottom: 4px; }
    .insta-link{ font-size: 10px; padding: 4px 10px; gap: 4px; }
    .insta-link svg{ width: 11px; height: 11px; }
    .top-left-time, .live-badge{ font-size: 9.5px; }
    .menu-btn{ width: 26px; height: 26px; }
    .menu-btn svg{ width: 13px; height: 13px; }
  }

  @media (min-width: 700px) and (min-height: 600px){
    .bottom-stack{ gap: 16px; bottom: max(28px, env(safe-area-inset-bottom)); }
    .center-name{ font-size: clamp(28px, 2.6vw, 44px); }
    .caption-strip{ font-size: 14px; width: min(340px, 90vw); }
    .player-card{ width: min(340px, 90vw); padding: 16px 20px 16px; border-radius: 26px; }
    .player-row{ gap: 12px; }
    .art{ width: 58px; height: 58px; font-size: 19px; }
    .art::after{ width: 7px; height: 7px; }
    .meta .track-title{ font-size: 16px; }
    .meta .track-sub{ font-size: 12.5px; }
    .controls{ gap: 8px; }
    .ctrl-btn{ width: 38px; height: 38px; }
    .ctrl-btn.play{ width: 44px; height: 44px; }
    .ctrl-btn svg{ width: 14px; height: 14px; }
    .ctrl-btn.play svg{ width: 16px; height: 16px; }
    .progress-row{ margin-top: 12px; font-size: 11px; }
    .credit-block .made-with{ font-size: 13px; }
    .insta-link{ font-size: 13px; padding: 8px 16px; }
    .insta-link svg{ width: 15px; height: 15px; }
    .top-left-time, .live-badge{ font-size: 13px; }
    .menu-btn{ width: 36px; height: 36px; }
    .menu-btn svg{ width: 18px; height: 18px; }
  }
</style>
</head>
<body>

  <img class="bg-photo" id="bgPhoto" src="bg.jpg" alt="">
  <video class="butterfly-overlay" id="butterflyOverlay" src="butterflies.mp4" muted loop playsinline preload="auto"></video>
  <img class="boy-cutout" id="boyCutout" src="boy.png" alt="">

  <div class="menu-wrap">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
    <div class="menu-dropdown" id="menuDropdown"></div>
  </div>

  <div class="top-left-time" id="istTime">--:--</div>

  <div class="live-badge">
    <span class="dot"></span>
    <span id="onlineCount">-- online</span>
  </div>

  <div class="bottom-stack">
    <div class="center-name">आदित्य</div>
    <div class="caption-strip" id="captionStrip"></div>

    <div class="player-card">
      <div class="player-row">
        <div class="art" id="art"><span id="artEmoji">🎵</span><img id="artImg" alt=""></div>
        <div class="meta">
          <p class="track-title" id="trackTitle">𝐏𝖑𝖆𝐲𝖑𝖎𝖘𝖙 𝐚𝖗𝖊 𝐥𝖔𝖆𝖉𝖎𝖓𝖌...</p>
          <p class="track-sub" id="trackSub"></p>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn play" id="playBtn" aria-label="Play">
            <svg viewBox="0 0 24 24" fill="currentColor"><path id="playIconPath" d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="nextBtn" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
          </button>
        </div>
      </div>
      <div class="progress-row">
        <span id="curTime">0:00</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span id="durTime">0:00</span>
      </div>
      <div class="player-frame"><div id="ytPlayer"></div></div>
    </div>

    <div class="hint-marquee">
      <div class="hint-marquee-track">

<script>
  const RESUME_KEY = 'musicfy_resume_v1';

  function fetchYoutubeSearchResults(query, maxResults){
    const url = `https://rabbitapi.zone.id/search/youtube?q=${encodeURIComponent(query)}&limit=${maxResults || 15}`;
    return fetch(url)
      .then(r => r.ok ? r.json() : Promise.reject(new Error('YouTube search failed')))
      .then(data => {
        let items = [];
        if (Array.isArray(data)) items = data;
        else if (data && Array.isArray(data.data)) items = data.data;
        else if (data && Array.isArray(data.results)) items = data.results;
        else if (data && Array.isArray(data.items)) items = data.items;

        return items.map(item => ({
          videoId: item.videoId || item.id || (item.url ? item.url.split('v=')[1] : ''),
          title: item.title || item.name || 'Unknown Title',
          channel: item.channel || item.author || item.uploader || 'YouTube',
          thumbnail: item.thumbnail || item.image || (item.videoId ? `https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg` : '')
        })).filter(i => i.videoId);
      });
  }

  function loadResumeState(){
    try{
      const raw = localStorage.getItem(RESUME_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.playlistId) return null;
      return parsed;
    } catch(err){ return null; }

  function fmtTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateProgress(){
    if (!ytPlayer || !ytPlayer.getCurrentTime) return;
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    curTime.textContent = fmtTime(cur);
    durTime.textContent = fmtTime(dur);
    progressFill.style.width = dur ? `${(cur/dur)*100}%` : '0%';
    saveResumeState();
  }

  function saveResumeState(){
    if (!ytPlayer || !ytReady || !currentPlaylistId) return;
    if (!ytPlayer.getCurrentTime || !ytPlayer.getPlaylistIndex) return;
    try{
      const idx = ytPlayer.getPlaylistIndex();
      const time = ytPlayer.getCurrentTime() || 0;
      localStorage.setItem(RESUME_KEY, JSON.stringify({
        playlistId: currentPlaylistId,
        index: idx >= 0 ? idx : 0,
        time: time
      }));
    } catch(err){}
  }

  function parseTitleArtist(rawTitle, author){
    if (!rawTitle) return { title: 'Unknown', artist: author || '' };
    let cleaned = rawTitle.replace(/[\(\[][^)\]]*(official|lyric|audio|video|full song|hd|4k)[^)\]]*[\)\]]/gi, '').trim();
    const seps = [' - ', ' – ', ' — ', ' | ', ' • '];
    for (const sep of seps){
      if (cleaned.includes(sep)){
        const parts = cleaned.split(sep).map(s => s.trim()).filter(Boolean);
        if (parts.length >= 2){
          return { title: parts[0], artist: parts.slice(1).join(', ') };
        }
      }
    }
    return { title: cleaned || rawTitle, artist: author || '' };
  }

  function updateMeta(data){
    if (!data || !data.title) return;
    const parsed = parseTitleArtist(data.title, data.author);
    trackTitle.textContent = parsed.title;
    trackSub.textContent = parsed.artist || data.author || '';
    lastSearchMeta = parsed;
    if (data.video_id){
      artImg.src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
      artImg.style.display = 'block';
      if (artEmoji) artEmoji.style.display = 'none';
    }
    updateMediaSessionMeta(parsed, data.video_id);
  }

  function updateMediaSessionMeta(parsed, videoId){
    if (!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: parsed.title || 'Musicfy',
        artist: parsed.artist || '',
        album: 'Musicfy',
        artwork: videoId ? [
          { src: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' },
          { src: `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`, sizes: '1280x720', type: 'image/jpeg' }
        ] : []
      });
    } catch(err){}
  }

  function setupMediaSessionHandlers(){
    if (!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.setActionHandler('play', () => { if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); });
      navigator.mediaSession.setActionHandler('previoustrack', () => { if (ytPlayer && ytPlayer.previousVideo) ytPlayer.previousVideo(); });
      navigator.mediaSession.setActionHandler('nexttrack', () => { if (ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo(); });
    } catch(err){}
  }
  setupMediaSessionHandlers();

  function resetDisplay(){
    trackTitle.textContent = '𝐏𝖑𝖆𝐲𝖑𝖎𝖘𝖙 𝐚𝖗𝖊 𝐥𝖔𝖆𝖉𝖎𝖓𝖌 𝐬𝖔 𝐰𝖆𝖎𝖙 2-3 𝐬𝖊𝖈..';

  function handlePlayerStateChange(e){
    if (e.data === YT.PlayerState.PLAYING){
      setPlayingIcon(true);
      updateMeta(ytPlayer.getVideoData());
      setSpinning(true);
      showButterflies();
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      if (!progressInterval) progressInterval = setInterval(updateProgress, 500);
    } else if (e.data === YT.PlayerState.PAUSED){
      setPlayingIcon(false);
      setSpinning(false);
      hideButterflies();
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      saveResumeState();
    } else if (e.data === YT.PlayerState.ENDED){
      setPlayingIcon(false);
      setSpinning(false);
      hideButterflies();
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      if (inSearchMode) playNextRelatedSong();
    } else if (e.data === YT.PlayerState.CUED){
      updateMeta(ytPlayer.getVideoData());
    }
  }

  function createPlayer(listId, autoplay, onReadyExtra, startIndex){
    ytPlayer = new YT.Player('ytPlayer', {
      height: '100%',
      width: '100%',
      playerVars: { listType: 'playlist', list: listId, index: (typeof startIndex === 'number' ? startIndex : 0), autoplay: autoplay ? 1 : 0, playsinline: 1, fs: 0 },
      events: {
        onReady: (e) => {
          ytReady = true;
          const data = e.target.getVideoData ? e.target.getVideoData() : null;
          updateMeta(data);
          if (!autoplay){
            try { e.target.pauseVideo(); } catch(err){}
          }
          if (onReadyExtra) onReadyExtra(e.target);
        },
        onStateChange: handlePlayerStateChange,
        onError: () => {
          trackTitle.textContent = '𝐓𝖍𝖎𝖘 𝐩𝖑𝖆𝐲𝖑𝖎𝖘𝖙 𝐜𝖆𝖓 𝐧𝖔𝖙 𝐥𝖔𝖆𝖉𝖎𝖓𝖌 𝐫𝖎𝖌𝖍𝖙 𝐧𝖔𝖜!';
          trackSub.textContent = '';
          hideButterflies();
        }
      }
    });
  }

  function createSingleVideoPlayer(videoId){
    ytPlayer = new YT.Player('ytPlayer', {
      height: '100%',
      width: '100%',
      playerVars: { videoId: videoId, autoplay: 1, playsinline: 1, fs: 0 },
      events: {
        onReady: (e) => {
          ytReady = true;
          updateMeta(e.target.getVideoData ? e.target.getVideoData() : null);
        },
        onStateChange: handlePlayerStateChange,
        onError: () => {
          trackTitle.textContent = '❌ 𝐓𝐡𝐢𝐬 𝐬𝐨𝐧𝐠 𝐜𝐚𝐧 𝐧𝐨𝐭 𝐛𝐞 𝐩𝐥𝐚𝐲𝐞𝐝!';
          trackSub.textContent = '';
          hideButterflies();
          if (inSearchMode) playNextRelatedSong();
        }
      }
    });
  }

  function playStandaloneVideo(videoId){
    resetDisplay();
    hideButterflies();
    ytReady = false;
    if (progressInterval){ clearInterval(progressInterval); progressInterval = null; }
    if (ytPlayer && ytPlayer.loadVideoById){
      try{
        ytPlayer.loadVideoById(videoId);
        ytReady = true;
        return;
      } catch(err){}
    }
    if (ytPlayer && ytPlayer.destroy){
      try{ ytPlayer.destroy(); } catch(err){}
      ytPlayer = null;
    }
    createSingleVideoPlayer(videoId);
  }

  function playNextRelatedSong(){
    const query = [lastSearchMeta.title, lastSearchMeta.artist].filter(Boolean).join(' ');
    if (!query){ inSearchMode = false; return; }
    fetchYoutubeSearchResults(query, 6)
      .then(results => {
        const next = results.find(r => !recentlyPlayedVideoIds.includes(r.videoId));
        if (!next){ inSearchMode = false; return; }
        recentlyPlayedVideoIds.push(next.videoId);
        if (recentlyPlayedVideoIds.length > 25) recentlyPlayedVideoIds.shift();
        playStandaloneVideo(next.videoId);
      })
      .catch(() => { inSearchMode = false; });
  }

  function onYouTubeIframeAPIReady(){
    if (currentPlaylistId){

        if (!resumeState) return;
        if (resumeState.time){
          setTimeout(() => {
            try{
              player.seekTo(resumeState.time, true);
              player.pauseVideo();
            } catch(err){}
          }, 300);

    listenBtn.textContent = '𝐋𝖎𝖘𝖙𝖊𝖓 𝐭𝖍𝖎𝖘 𝐩𝖑𝖆𝐲𝖑𝖎𝖘𝖙';
    listenBtn.addEventListener('click', () => {
      switchToPlaylist(pl.id, false);
      menuDropdown.classList.remove('open');
    });
    menuDropdown.appendChild(listenBtn);

    const selectBtn = document.createElement('button');
    selectBtn.className = 'menu-item';
    selectBtn.textContent = '𝐒𝖊𝖑𝖊𝖈𝖙 𝖆 𝐬𝖔𝖓𝖌 𝐟𝖗𝖔𝖒 𝐭𝖍𝖊 𝐥𝖎𝖘𝖙!';
    selectBtn.addEventListener('click', () => navigateMenu(() => renderSongList(pl)));
    menuDropdown.appendChild(selectBtn);
  }

  function renderYoutubeSearch(){
    clearMenu();
    const back = document.createElement('button');
    back.className = 'menu-item menu-back';
    back.textContent = '← 𝐁𝖆𝖈𝖐';
    back.addEventListener('click', () => navigateMenu(renderFolderList));
    menuDropdown.appendChild(back);

    const header = document.createElement('div');
    header.className = 'menu-header';
    header.textContent = '𝐒𝖊𝖆𝖗𝖈𝖍 𝐘𝐨𝐮𝐓𝐮𝐛𝐞';
    menuDropdown.appendChild(header);

    const searchWrap = createSearchBar('𝐒𝖊𝖆𝖗𝖈𝖍 𝐚𝐧𝐲 𝐬𝐨𝖓𝖌 𝐨𝖓 𝐘𝐨𝐮𝐓𝐮𝐛𝐞...', (query) => runSearch(query));
    menuDropdown.appendChild(searchWrap);

    const listContainer = document.createElement('div');
    listContainer.className = 'menu-list-items';
    menuDropdown.appendChild(listContainer);

    let searchDebounce = null;

    function runSearch(query){
      clearTimeout(searchDebounce);
      const q = query.trim();
      if (!q){ listContainer.innerHTML = ''; return; }
      listContainer.innerHTML = '';
      const loading = document.createElement('div');
      loading.className = 'menu-loading';
      loading.textContent = '𝐒𝖊𝖆𝖗𝖈𝖍𝖎𝖓𝖌 𝐘𝐨𝐮𝐓𝐮𝐛𝐞...';
      listContainer.appendChild(loading);

      searchDebounce = setTimeout(() => {
        fetchYoutubeSearchResults(q, 15)
          .then(results => {
            if (!document.body.contains(listContainer)) return;
            renderResults(results);
          })
          .catch(() => {
            if (!document.body.contains(listContainer)) return;
            listContainer.innerHTML = '';
            const err = document.createElement('div');
            err.className = 'menu-empty';
            err.textContent = '❌ Search fail ho gaya, dobara try karo.';
            listContainer.appendChild(err);
          });
      }, 450);
    }

    function renderResults(results){
      listContainer.innerHTML = '';
      if (!results.length){
        const empty = document.createElement('div');
        empty.className = 'menu-empty';
        empty.textContent = 'Koi song nahi mila';
        listContainer.appendChild(empty);
        return;
      }
      results.forEach(r => {
        const item = document.createElement('button');
        item.className = 'song-item';
        const t = document.createElement('span');
        t.className = 'song-title';
        t.textContent = r.title;
        const a = document.createElement('span');
        a.className = 'song-artist';
        a.textContent = r.channel;
        item.appendChild(t);
        item.appendChild(a);
        item.addEventListener('click', () => {
          playSearchResult(r);
          menuDropdown.classList.remove('open');
        });
        listContainer.appendChild(item);
      });
    }
  }

  function playSearchResult(r){
    inSearchMode = true;
    currentPlaylistId = null;
    activePlaylistId = null;
    recentlyPlayedVideoIds = [r.videoId];
    playStandaloneVideo(r.videoId);
  }

  function renderSongList(pl){
    clearMenu();
    const back = document.createElement('button');
    back.className = 'menu-item menu-back';
    back.textContent = '← Back';
    back.addEventListener('click', () => navigateMenu(() => renderOptions(pl)));
    menuDropdown.appendChild(back);

    const header = document.createElement('div');
    header.className = 'menu-header';
    header.textContent = pl.name;
    menuDropdown.appendChild(header);

    const searchWrap = createSearchBar('𝐒𝖊𝖆𝖗𝖈𝖍 𝐬𝖔𝖓𝖌...', (query) => filterSongItems(query));
    menuDropdown.appendChild(searchWrap);

    const listContainer = document.createElement('div');
    listContainer.className = 'menu-list-items';
    menuDropdown.appendChild(listContainer);

    const loading = document.createElement('div');
    loading.className = 'menu-loading';
    loading.textContent = '𝐒𝖔𝖓𝖌𝖘 𝐚𝖗𝖊 𝐥𝖔𝖆𝖉𝖎𝖓𝖌 𝖘𝖔 𝐛𝖊 𝐩𝖆𝖙𝖎𝖊𝖓𝖙..';
    listContainer.appendChild(loading);

    let allSongs = [];

    function renderSongItems(list){
      listContainer.innerHTML = '';
      if (!list.length){
        const empty = document.createElement('div');
        empty.className = 'menu-empty';
        empty.textContent = allSongs.length ? 'Koi song nahi mila' : '𝐂𝖔𝖚𝖑𝖉 𝐧𝖔𝖙 𝐟𝖎𝖓𝖉𝖎𝖓𝖌 𝐭𝐡𝐞 𝐬𝖔𝖓𝖌𝖘!';
        listContainer.appendChild(empty);
        return;
      }
      list.forEach(song => {
        const item = document.createElement('button');
        item.className = 'song-item';
        const t = document.createElement('span');
        t.className = 'song-title';
        t.textContent = song.title;
        const a = document.createElement('span');
        a.className = 'song-artist';
        a.textContent = song.artist;
        item.appendChild(t);
        item.appendChild(a);
        item.addEventListener('click', () => {
          playSongAtIndex(pl, song.index);
          menuDropdown.classList.remove('open');
        });
        listContainer.appendChild(item);
      });
    }

    function filterSongItems(query){
      const q = query.trim().toLowerCase();
      const filtered = !q ? allSongs : allSongs.filter(s =>
        (s.title && s.title.toLowerCase().includes(q)) || (s.artist && s.artist.toLowerCase().includes(q))
      );
      renderSongItems(filtered);
    }

    fetchPlaylistVideoIds(pl, (videoIds) => {
      if (!videoIds || !videoIds.length){
        allSongs = [];
        renderSongItems([]);
        return;
      }
      fetchTitles(videoIds).then(songs => {
        if (!document.body.contains(listContainer)) return;
        allSongs = songs.map((song, idx) => ({ ...song, index: idx }));
        filterSongItems(searchWrap._input.value);
      });
    });
  }

  function fetchPlaylistVideoIds(pl, callback){
    if (ytPlayer && ytReady && currentPlaylistId === pl.id && ytPlayer.getPlaylist){
      const list = ytPlayer.getPlaylist();
      if (list && list.length){ callback(list); return; }
    }
    if (ytTempPlayer && ytTempPlayer.destroy){
      try { ytTempPlayer.destroy(); } catch(err){}
      ytTempPlayer = null;
    }
    ytTempPlayer = new YT.Player('ytTempPlayer', {
      height: '1',
      width: '1',
      playerVars: { listType: 'playlist', list: pl.id, autoplay: 0, mute: 1, playsinline: 1 },
      events: {
        onReady: (e) => {
          try { e.target.mute(); e.target.pauseVideo(); } catch(err){}
          const list = e.target.getPlaylist ? (e.target.getPlaylist() || []) : [];
          callback(list);
        },
        onError: () => callback([])
      }
    });
  }

  function fetchTitles(videoIds){
    return Promise.all(videoIds.map(id =>
      fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + id)}&format=json`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          const parsed = parseTitleArtist(data.title, data.author_name);
          return { id, title: parsed.title, artist: parsed.artist };
        })
        .catch(() => ({ id, title: 'Unknown song', artist: '' }))
    ));
  }

  function playSongAtIndex(pl, index){
    if (ytPlayer && ytReady && currentPlaylistId === pl.id && ytPlayer.playVideoAt){
      ytPlayer.playVideoAt(index);
      return;
    }
    switchToPlaylist(pl.id, false, (player) => {
      if (player && player.playVideoAt) player.playVideoAt(index);
    });
  }

  function switchToPlaylist(listId, autoplay, onReadyExtra){
    inSearchMode = false;
    activePlaylistId = listId;
    currentPlaylistId = listId;
    resetDisplay();
    hideButterflies();
    ytReady = false;
    if (progressInterval){ clearInterval(progressInterval); progressInterval = null; }
    if (ytPlayer && ytPlayer.destroy){
      ytPlayer.destroy();
      ytPlayer = null;
    }
    createPlayer(listId, autoplay, onReadyExtra);
  }
</script>
